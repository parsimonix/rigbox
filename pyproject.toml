[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rigbox"
version = "0.1.0"
description = "Embedded/DSP developer's toolbox: a manifest-driven REPL and CLI."
requires-python = ">=3.11"
dependencies = [
    "cmd2>=4.3,<5",
    "construct>=2.10",
    "numpy>=1.24",
    "pluggy>=1.3",
    "pydantic>=2",
    "pyserial>=3.5",
    "pyyaml>=6",
    "rich>=15",
    "scipy>=1.10",
    "simpleeval>=1.0",
    "transitions>=0.9",
    "typer>=0.27.3",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
# ty is pinned exactly: it is in beta (0.0.x) and its rules change between releases
dev = ["pytest>=7", "matplotlib>=3.7", "ruff>=0.6", "ty==0.0.89"]

[project.scripts]
rigbox = "rigbox.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src", "tests"]

[tool.ruff]
target-version = "py311"
line-length = 160

[tool.ruff.lint]
# E/F: pycodestyle and pyflakes; I: import order; UP: modern syntax; B: likely bugs;
# D: docstrings (Google style); ANN: type annotations
select = ["E", "F", "I", "UP", "B", "D", "ANN"]
ignore = [
    "B008", # Do not perform function call `typer.Argument` in argument defaults
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]  # tests are annotated like other code, but test functions don't need docstrings
