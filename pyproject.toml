[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rigbox"
version = "1.0.2"
description = "Embedded developer's toolbox: a manifest-driven REPL and CLI."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Jonathan Bailey", email = "jonathan.bailey@comcast.net" }
]
dependencies = [
    "cmd2>=4.3,<5",
    "construct>=2.10",
    "jinja2>=3.1.6",
    "networkx>=3.4,<4",
    "numpy>=1.24",
    "pluggy>=1.3",
    "pydantic>=2.12",
    "pyserial>=3.5",
    "pyyaml>=6",
    "rich>=15",
    "scipy>=1.10",
    "simpleeval>=1.0",
    "transitions>=0.9",
    "typer>=0.27.3",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
# ty is pinned exactly: it is in beta (0.0.x) and its rules change between releases
dev = ["pytest>=7", "matplotlib>=3.7", "ruff>=0.6", "ty==0.0.89"]

[project.scripts]
rigbox = "rigbox.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rigbox.plugins.code" = ["macros/**/*.j2", "templates/**/*.j2"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_message = "{version}\n\nAutomatically generated by python-semantic-release"
commit_parser = "conventional"
major_on_zero = false  # TODO: Change this when stable
allow_zero_version = true  # TODO: Remove this when major_on_zero == true
tag_format = "v{version}"
build_command = "uv build"

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease_token = "rc"
prerelease = false

[tool.semantic_release.changelog]
exclude_commit_patterns = []
mode = "init"
insertion_flag = "<!-- version list -->"
template_dir = "templates"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"
mask_initial_release = false

[tool.semantic_release.commit_author]
env = "GIT_COMMIT_AUTHOR"
default = "semantic-release <semantic-release>"

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix"]
other_allowed_tags = ["build", "chore", "ci", "docs", "style", "refactor", "test"]
allowed_tags = ["feat", "fix", "build", "chore", "ci", "docs", "style", "refactor", "test"]
default_bump_level = 0
parse_squash_commits = true
ignore_merge_commits = true

[tool.semantic_release.remote]
name = "origin"
type = "github"
ignore_token_for_push = false
insecure = false

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src", "tests"]

[tool.ruff]
target-version = "py311"
line-length = 160

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.ruff.lint]
# E/F: pycodestyle and pyflakes; I: import order; UP: modern syntax; B: likely bugs;
# D: docstrings (Google style); ANN: type annotations
select = ["E", "F", "I", "UP", "B", "D", "ANN"]
ignore = [
    "B008", # Do not perform function call `typer.Argument` in argument defaults
    "ANN401", # Dynamically typed expressions are disallowed
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]  # tests are annotated like other code, but test functions don't need docstrings
